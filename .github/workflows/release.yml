name: Release

on:
  release:
    types: [published]

env:
  NODE_VERSION: '22'
  HUSKY: '0'

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm Trusted Publisher (OIDC)

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Resolve target ref
        id: target
        env:
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "Invalid release tag: $TAG_NAME (expected X.Y.Z or X.Y.Z-beta.N, optional leading v)"
            exit 1
          fi
          BRANCH="chore/version-${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "ref=$TARGET_COMMITISH" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package version
        id: bump
        env:
          VERSION: ${{ steps.target.outputs.version }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git checkout -B "$BRANCH"
          npm version "$VERSION" --no-git-tag-version
          git add package.json
          if [ -f yarn.lock ]; then
            git add yarn.lock
          fi
          if git diff --cached --quiet; then
            echo "package.json already at version $VERSION"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: version ${VERSION}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push version branch and retag
        env:
          TAG_NAME: ${{ steps.target.outputs.tag }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git push origin "HEAD:${BRANCH}" --force
          git tag -f "$TAG_NAME"
          git push origin "refs/tags/${TAG_NAME}" --force

      - name: Open version bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.target.outputs.version }}
          BRANCH: ${{ steps.target.outputs.branch }}
          BASE_REF: ${{ steps.target.outputs.ref }}
          TAG_NAME: ${{ steps.target.outputs.tag }}
        run: |
          EXISTING="$(gh pr list --head "$BRANCH" --base "$BASE_REF" --state open --json number --jq '.[0].number // empty')"
          BODY=$(cat <<EOF
          Automated version bump for release \`${TAG_NAME}\`.

          npm publish runs from this workflow after tests/build.
          Merge this PR (use bypass if branch protection blocks) so \`${BASE_REF}\` gets \`package.json\` at \`${VERSION}\`.

          Prefer **Create a merge commit** (not squash) so the release tag stays on the bumped commit.
          EOF
          )
          BODY="$(printf '%s\n' "$BODY" | sed -e 's/^[[:space:]]*//')"
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already open for ${BRANCH}"
            gh pr edit "$EXISTING" --title "chore: version ${VERSION}" --body "$BODY"
          else
            gh pr create \
              --base "$BASE_REF" \
              --head "$BRANCH" \
              --title "chore: version ${VERSION}" \
              --body "$BODY"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 (Node 22 image may ship an older CLI)
      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn coverage

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittest
          fail_ci_if_error: true

      - name: Build
        run: yarn build

      - name: Publish to npm
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --access public --tag beta
          else
            npm publish --access public --tag latest
          fi
